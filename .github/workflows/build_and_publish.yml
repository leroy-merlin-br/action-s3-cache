name: Build and publish

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'release:') }}
    outputs:
      go_version: ${{ steps.go-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Go version from go.mod
        id: go-version
        run: |
          GO_VERSION=$(make print-go-version)
          echo "Extracted Go version: $GO_VERSION"
          echo "version=$GO_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        # As this repo is a public fork the public setup-go action is used here instead of our private one
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go-version.outputs.version }}

      - name: Build binaries
        run: make build

      - name: Determine next version
        id: next-version
        run: |
          LAST_TAG=$(git tag --list "v*" --sort=-v:refname | head --lines=1)

          if [[ -z "$LAST_TAG" ]]; then
            NEXT_VERSION="v1"
          else
            VERSION_NUM=${LAST_TAG#v}
            NEXT_VERSION="v$((VERSION_NUM + 1))"
          fi

          echo "next-version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update README version
        run: make update-readme-version VERSION=${{ steps.next-version.outputs.next-version }}

      - name: Create release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="release/${{ steps.next-version.outputs.next-version }}"

          git config --global user.email "${{ github.event.pusher.email }}"
          git config --global user.name "${{ github.event.pusher.name }}"
          git checkout -b "$BRANCH"
          git add .
          git commit --message "release: ${{ steps.next-version.outputs.next-version }}"
          git push origin "$BRANCH"

          gh pr create \
            --title "release: ${{ steps.next-version.outputs.next-version }}" \
            --body "Automated release PR with built binaries for ${{ steps.next-version.outputs.next-version }}" \
            --base develop \
            --head "$BRANCH"

  release:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.event.head_commit.message, 'release:') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from commit message
        id: version
        run: |
          VERSION=$(echo "${{ github.event.head_commit.message }}" | sed 's/release: //')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}

          gh release create ${{ steps.version.outputs.version }} \
            --title "${{ steps.version.outputs.version }}" \
            --generate-notes
